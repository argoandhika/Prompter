#
# Build otomatis Prompter untuk Windows, macOS, dan Linux di server GitHub.
#
# - Setiap push ke main : build + tes di 3 OS, hasilnya bisa diunduh di tab
#                         Actions -> run terkait -> "Artifacts" (untuk dicoba).
# - Setiap tag v*       : sama, lalu Release dibuat otomatis berisi 3 file:
#                         Prompter-vX.Y.Z-windows.zip / -macos.zip / -linux.tar.gz
#
# Cara merilis versi baru (lihat README bagian "Merilis versi baru"):
#   git tag v1.1.0
#   git push origin v1.1.0

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # dibutuhkan untuk membuat Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-14          # Mac Apple Silicon (M1/M2/M3/M4)
            label: macos
          - os: ubuntu-22.04      # glibc 2.35 -> jalan di Ubuntu 22.04+, Debian 12+, Fedora 36+, dll.
            label: linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Library sistem Linux untuk Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfontconfig1 libdbus-1-3

      - name: Instal library Python
        run: python -m pip install -r requirements.txt

      - name: Tes cepat (aplikasi bisa dimuat)
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]);
          import prompter_window, control_bar; from editor_window import EditorWindow;
          w = EditorWindow(); w.editor.document().setModified(False); w.close(); print('OK', w.windowTitle())"

      - name: Versi rilis
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME}"; else V="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name Prompter
          --version-file version_info.txt main.py

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name Prompter
          --osx-bundle-identifier com.argoandhika.prompter main.py

      - name: Bungkus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md dist/Prompter/
          Compress-Archive -Path dist/Prompter -DestinationPath "Prompter-$env:VERSION-windows.zip"

      - name: Bungkus (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir Prompter && cp -R dist/Prompter.app LICENSE README.md Prompter/
          ditto -c -k --keepParent Prompter "Prompter-$VERSION-macos.zip"

      - name: Bungkus (Linux)
        if: runner.os == 'Linux'
        run: |
          cp LICENSE README.md dist/Prompter/
          tar -czf "Prompter-$VERSION-linux.tar.gz" -C dist Prompter

      - uses: actions/upload-artifact@v4
        with:
          name: Prompter-${{ matrix.label }}
          path: Prompter-*-${{ matrix.label }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Prompter ${{ github.ref_name }}
          files: files/*
          generate_release_notes: true
          body: |
            ## Download
            | OS | File | Cara pakai |
            |---|---|---|
            | **Windows 10/11** | `Prompter-${{ github.ref_name }}-windows.zip` | Ekstrak, klik dua kali `Prompter\Prompter.exe`. Jika muncul SmartScreen: *More info → Run anyway*. |
            | **macOS** (Apple Silicon) | `Prompter-${{ github.ref_name }}-macos.zip` | Ekstrak, pindahkan `Prompter.app` ke *Applications*. Pertama kali: **klik kanan → Open → Open** (aplikasi belum ditandatangani Apple). |
            | **Linux** (x86-64) | `Prompter-${{ github.ref_name }}-linux.tar.gz` | `tar -xzf Prompter-*-linux.tar.gz` lalu jalankan `./Prompter/Prompter` |

            Tekan **F1** di layar baca untuk melihat semua tombol pintas.

